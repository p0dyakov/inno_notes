name: deploy-site
# Primitive deploy only: publishes the prebuilt _site/ directory.
# The site is built on a Windows machine (fast R/Quarto binaries) and
# committed under _site/ — see scripts/publish.sh. This workflow installs
# NOTHING (no Python/Node/R/Quarto/TeX) and finishes in about a minute.
on:
  push:
    branches: [main]
    paths:
      - '_site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Smoke check built site
        shell: bash
        run: |
          test -f _site/index.html || (echo "::error::_site/index.html missing — build on Windows and commit _site/ first (scripts/publish.sh)" && exit 1)
          test -f _site/CNAME || echo "::warning::_site/CNAME missing"
          echo "smoke: _site ok, $(find _site -name '*.html' | wc -l) html pages"
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          cname: innonotes.ru
          enable_jekyll: false
