name: deploy-site
on:
  push:
    branches: [main]
    paths:
      - 'semester-4/**/*.qmd'
      - 'semester-1/**/*.qmd'
      - 'semester-2/**/*.qmd'
      - '_quarto.yml'
      - 'styles/**'
      - 'scripts/**'
      - 'index.qmd'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  precheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate formatting (must be 0 violations before deploy)
        run: |
          python3 fix_formatting.py
          cat formatting_report.md | head -n 30
          if ! grep -q "No format-rule violations detected" formatting_report.md; then
            echo "::error::fix_formatting found violations — deploy blocked. Run python3 fix_formatting.py locally."
            exit 1
          fi
          if ! grep -q "No potential AI artifacts detected" formatting_report.md; then
            echo "::error::AI artifacts detected — deploy blocked."
            exit 1
          fi
          echo "precheck: formatting clean"
      - name: Validate quarto config
        run: |
          pip install pyyaml --quiet
          python3 -c "import yaml; yaml.safe_load(open('_quarto.yml'))" && echo "yaml ok"

  deploy:
    runs-on: ubuntu-latest
    needs: precheck
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup R (required by knitr engine)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Install system libs for R packages (libuv for fs/rmarkdown)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libuv1-dev
      - name: Install R dependencies
        run: |
          Rscript -e 'for (pkg in c("knitr", "rmarkdown", "igraph")) if (!requireNamespace(pkg, quietly=TRUE)) install.packages(pkg, repos="https://cloud.r-project.org")'
      - run: npm ci --silent || npm install --silent
      - run: pip install pyyaml --quiet && python3 -c "import yaml; yaml.safe_load(open('_quarto.yml'))" && echo "yaml ok"
      - name: Render site
        run: quarto render
      - name: Smoke check built site
        run: |
          test -f _site/index.html || (echo "::error::_site/index.html missing after render" && exit 1)
          test -f _site/search.json || echo "::warning::search.json missing"
          echo "smoke: _site ok, $(find _site -name '*.html' | wc -l) html pages"
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          cname: innonotes.ru
          enable_jekyll: false
