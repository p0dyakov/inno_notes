name: deploy-site
# Dumb deploy: this workflow installs NOTHING (no Python/Node/R/Quarto).
# The site is built locally (`quarto render`, see scripts/publish.sh) and
# committed under _site/. Here we only smoke-check and publish _site/
# to gh-pages. Typical run time: under a minute.
on:
  push:
    branches: [main]
    paths:
      - '_site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Smoke check built site
        shell: bash
        run: |
          test -f _site/index.html || (echo "::error::_site/index.html missing — run scripts/publish.sh locally first" && exit 1)
          test -f _site/CNAME || echo "::warning::_site/CNAME missing"
          echo "smoke: _site ok, $(find _site -name '*.html' | wc -l) html pages"
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          cname: innonotes.ru
          enable_jekyll: false
