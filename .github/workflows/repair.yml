name: repair-on-deploy-failure
# Auto-repair DISABLED (2026-09-05): API-key quota is reserved for article
# generation; LLM-driven repair returns on the antigravity backend later.
# Manual runs still possible via workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'failed deploy-site run id (empty = latest failed)'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: repair-on-deploy-failure
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download failed deploy log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ inputs.run_id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --workflow deploy-site --status failure --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          echo "Failed run: $RUN_ID"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          gh run view "$RUN_ID" --log-failed > /tmp/deploy_fail.log 2>&1 || gh run view "$RUN_ID" --log > /tmp/deploy_fail.log 2>&1 || true
          tail -n 120 /tmp/deploy_fail.log
          echo "---"
          grep -iE "error|failed|not found|entity|Rscript|quarto|yaml" /tmp/deploy_fail.log | head -n 40 || true
      - name: Classify failure and auto-fix known cases
        run: |
          python3 scripts/agent/repair_deploy.py --log /tmp/deploy_fail.log
      - name: Verify fix compiles
        run: |
          python3 fix_formatting.py
          if ! grep -q "No format-rule violations detected" formatting_report.md; then
            echo "::warning::formatting still has violations after repair — see report"
            head -n 40 formatting_report.md
          fi
          pip install pyyaml --quiet
          python3 -c "import yaml; yaml.safe_load(open('_quarto.yml'))" && echo "yaml ok"
      - name: Commit repair if changed
        id: commit
        run: |
          git config user.name "inno-notes-agent"
          git config user.email "agent@innonotes.ru"
          git add -A -- _quarto.yml index.qmd scripts/ semester-4/ .github/workflows/
          if git diff --cached --quiet; then
            echo "Repair made no file changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git status --short
          git commit -m "fix(deploy): manual repair after failed deploy run $RUN_ID

          Co-authored-by: inno-notes-agent"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN pushes do not retrigger workflows, so kick a fresh
      # deploy-site run explicitly (needs a PAT with workflow scope).
      - name: Trigger deploy-site after repair
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.INNO_FILES_PAT }}
        run: |
          gh workflow run deploy-site --repo p0dyakov/inno_notes --ref main || \
            echo "::warning::deploy-site dispatch needs a PAT with workflow scope in INNO_FILES_PAT"
