<script>
// Patch WebSocket BEFORE quarto-preview.js so its messages don't interfere
// with SPA navigation. quarto-preview sends three relevant message types:
//   render:start  – shows render overlay
//   render:stop   – hides render overlay
//   reload        – reloads / replaces location
// Suppress render/reload WebSocket messages during SPA nav, static page hops,
// and on pre-baked pages (see scripts/preview.sh --render all).
(function () {
	if (!window.WebSocket) return;
	const innIsBakedPage = () => document.documentElement.hasAttribute('data-inn-baked');
	window.__innIsBakedPage = innIsBakedPage;
	const innSuppressPreviewRenderMsg = () => {
		if (innIsBakedPage()) return true;
		if (window._innNavigating) return true;
		try {
			return sessionStorage.getItem('inn-static-nav') === '1';
		} catch {
			return false;
		}
	};
	window.__innSuppressPreviewRenderMsg = innSuppressPreviewRenderMsg;
	const innMarkStaticNav = () => {
		try {
			sessionStorage.setItem('inn-static-nav', '1');
		} catch {
			/* ignore */
		}
	};
	window.__innMarkStaticNav = innMarkStaticNav;
	const innClearStaticNav = () => {
		try {
			sessionStorage.removeItem('inn-static-nav');
		} catch {
			/* ignore */
		}
	};
	window.__innClearStaticNav = innClearStaticNav;
	if (!innIsBakedPage()) {
		document.documentElement.classList.add('inn-ui-booting');
		if (document.body) document.body.classList.add('inn-ui-booting');
	}
	if (!document.getElementById('inn-page-loader') && document.body && !innIsBakedPage()) {
		var bootLoader = document.createElement('div');
		bootLoader.id = 'inn-page-loader';
		bootLoader.className = 'is-active is-booting';
		bootLoader.setAttribute('aria-hidden', 'true');
		bootLoader.innerHTML = '' +
			'<div class="inn-page-loader__backdrop"></div>' +
			'<div class="inn-page-loader__spinner"></div>';
		document.body.appendChild(bootLoader);
	}
	var Orig = window.WebSocket;
	function InnWS(url, proto) {
		var ws = proto !== undefined ? new Orig(url, proto) : new Orig(url);
		var _om = null, _oc = null;
		Object.defineProperty(ws, 'onmessage', {
			configurable: true,
			get: function () { return _om; },
			set: function (fn) {
				_om = fn;
				ws.addEventListener('message', function (e) {
					if (typeof e.data === 'string') {
						if (e.data.startsWith('render:stop')) {
							window.__innClearStaticNav?.();
						}
						if (window.__innSuppressPreviewRenderMsg?.() &&
							(e.data.startsWith('reload') || e.data.startsWith('render:'))) {
							return;
						}
					}
					fn.call(ws, e);
				});
			}
		});
		Object.defineProperty(ws, 'onclose', {
			configurable: true,
			get: function () { return _oc; },
			set: function (fn) {
				_oc = fn;
				ws.addEventListener('close', function (e) {
					if (window._innNavigating) return;
					fn.call(ws, e);
				});
			}
		});
		return ws;
	}
	InnWS.prototype = Orig.prototype;
	InnWS.CONNECTING = Orig.CONNECTING;
	InnWS.OPEN = Orig.OPEN;
	InnWS.CLOSING = Orig.CLOSING;
	InnWS.CLOSED = Orig.CLOSED;
	window.WebSocket = InnWS;
})();
</script>


<script>
	const initializeInnoNotesUI = async () => {
		/**
		 * Site root prefix (GitHub Pages: /inno_notes/, local Quarto preview: /).
		 * Must match how article paths appear in location.pathname.
		 */
		const computeSiteBasePath = () => {
			const raw = window.location.pathname.replace(/\/index\.html?$/i, '');
			const nested = raw.match(/^(.*\/)(semester-[12]\/)/);
			if (nested) {
				const prefix = nested[1];
				return prefix === '/' ? '/' : prefix;
			}
			const singleSeg = raw.match(/^(\/[^/]+)\/?$/);
			if (singleSeg) {
				const seg = singleSeg[1];
				if (!/^\/semester-[12]$/.test(seg)) {
					return seg.endsWith('/') ? seg : `${seg}/`;
				}
			}
			return '/';
		};
		const basePath = computeSiteBasePath();
		let loaderEl = document.getElementById('inn-page-loader');
		if (!loaderEl) {
			loaderEl = document.createElement('div');
			loaderEl.id = 'inn-page-loader';
			document.body.appendChild(loaderEl);
		}

		const setLoaderProgress = (value) => {
			const clamped = Math.max(0, Math.min(100, value));
			document.documentElement.style.setProperty('--inn-loader-progress', String(clamped));
		};

		const getLoaderProgress = () => {
			const raw = document.documentElement.style.getPropertyValue('--inn-loader-progress');
			const n = parseFloat(raw);
			return Number.isFinite(n) ? n : 0;
		};

		let loaderNudgeId = null;
		let loaderNudgeCeiling = 88;
		const stopLoaderNudge = () => {
			if (loaderNudgeId != null) {
				window.clearInterval(loaderNudgeId);
				loaderNudgeId = null;
			}
		};
		const setLoaderNudgeCeiling = (value) => {
			loaderNudgeCeiling = Math.max(loaderNudgeCeiling, Math.min(97, value));
		};
		const tickLoaderNudge = () => {
			if (!loaderEl.classList.contains('is-active')) {
				stopLoaderNudge();
				return;
			}
			const cur = getLoaderProgress();
			if (cur >= loaderNudgeCeiling - 0.75) return;
			const next = cur + Math.max(0.35, (loaderNudgeCeiling - cur) * 0.055);
			setLoaderProgress(Math.min(loaderNudgeCeiling - 0.5, next));
		};
		const startLoaderNudge = () => {
			stopLoaderNudge();
			loaderNudgeId = window.setInterval(tickLoaderNudge, 105);
		};

		const showLoader = () => {
			loaderEl.classList.remove('is-booting');
			setLoaderProgress(12);
			loaderEl.classList.add('is-active');
		};

		const advanceLoader = (value) => {
			if (!loaderEl.classList.contains('is-active')) return;
			setLoaderProgress(value);
		};

		const hideLoader = () => {
			stopLoaderNudge();
			setLoaderProgress(100);
			window.setTimeout(() => {
				loaderEl.classList.remove('is-active');
				loaderEl.classList.remove('is-booting');
				setLoaderProgress(0);
			}, 180);
		};
		const finishInitialBoot = () => {
			if (window.__innIsBakedPage?.()) {
				document.documentElement.classList.remove('inn-ui-booting');
				document.body?.classList.remove('inn-ui-booting');
				loaderEl.classList.remove('is-active', 'is-booting');
				setLoaderProgress(0);
				return;
			}
			advanceLoader(100);
			window.requestAnimationFrame(() => {
				window.requestAnimationFrame(() => {
					document.documentElement.classList.remove('inn-ui-booting');
					document.body?.classList.remove('inn-ui-booting');
					hideLoader();
				});
			});
		};

		const innUseSpaNav = () => true;
		const navigateTo = (href, options = {}) => {
			if (!innUseSpaNav()) {
				window.__innMarkStaticNav?.();
				if (options.replace) {
					window.location.replace(href);
				} else {
					window.location.assign(href);
				}
				return Promise.resolve();
			}
			const spaNavigate = window.__innNavigateInternal;
			if (typeof spaNavigate !== 'function') {
				window.location.assign(href);
				return Promise.resolve();
			}
			return spaNavigate(href, options);
		};

		const getPathKey = () => window.location.pathname.replace(/index\.html$/, '');
		const getRelativePath = () => getPathKey().replace(basePath, '');
		const innSitePathFromRel = (rel) => {
			const r = String(rel || '').replace(/^\/+/, '');
			const b = basePath.endsWith('/') ? basePath.slice(0, -1) : basePath;
			return `${b}/${r}`.replace(/\/+/g, '/');
		};
		const innPathToRel = (pathname) => {
			const p = normalizePath(pathname);
			const prefix = basePath.replace(/\/?$/, '');
			if (!p || p === prefix) return '';
			if (p.startsWith(`${prefix}/`)) return p.slice(prefix.length + 1);
			return p.replace(/^\//, '');
		};
		const getIsHome = () => {
			const relativePath = getRelativePath();
			return !relativePath || relativePath === '/' || /(^|\/)index\/?$/.test(relativePath);
		};

		const syncPageFooterVisibility = () => {
			const footer = document.querySelector('footer.footer');
			if (!footer) return;
			footer.removeAttribute('hidden');
		};

		const createPill = ({ title, meta, variant }) => {
			const button = document.createElement('button');
			button.className = `inn-pill inn-pill--${variant}`;
			button.type = 'button';
			button.innerHTML = `
				<span class="inn-pill__icon" aria-hidden="true">
					<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M3.5 8.4L6.7 11.6L12.5 4.4" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"/>
					</svg>
				</span>
				<span class="inn-pill__label">
					<span class="inn-pill__title">${title}</span>
					${meta ? `<span class="inn-pill__meta">${meta}</span>` : ''}
				</span>
			`;
			return button;
		};

		const setPillText = (button, title, meta) => {
			const titleEl = button.querySelector('.inn-pill__title');
			const metaEl = button.querySelector('.inn-pill__meta');
			if (titleEl) titleEl.textContent = title;
			if (metaEl) {
				if (meta) {
					metaEl.textContent = meta;
				} else {
					metaEl.remove();
				}
			} else if (meta) {
				const label = button.querySelector('.inn-pill__label');
				if (label) {
					const span = document.createElement('span');
					span.className = 'inn-pill__meta';
					span.textContent = meta;
					label.appendChild(span);
				}
			}
		};

		const normalizePath = (value) => {
			if (!value) return '';
			try {
				const url = new URL(value, window.location.origin + window.location.pathname);
				return url.pathname.replace(/index\.html$/, '');
			} catch {
				return value.replace(/index\.html$/, '');
			}
		};

		const getReadStorageKey = (value) => `read_${normalizePath(value)}`;
		const applyProgressiveContent = () => {};

		// Math/Mermaid are baked at `quarto render` (scripts/bake-static-html.mjs).
		const pageCache = new Map();
		const maxPageCacheEntries = 24;
		const assetLoadCache = new Map();
		const getPageCacheKey = (value) => {
			const url = new URL(value, window.location.href);
			url.hash = '';
			return `${url.pathname}${url.search}`;
		};
		const rememberPage = (key, payload) => {
			if (!payload?.main) return;
			if (pageCache.has(key)) pageCache.delete(key);
			pageCache.set(key, payload);
			if (pageCache.size > maxPageCacheEntries) {
				const oldestKey = pageCache.keys().next().value;
				if (oldestKey) pageCache.delete(oldestKey);
			}
		};
		const clonePagePayload = (payload) => ({
			title: payload.title,
			main: payload.main.cloneNode(true),
			assets: { ...payload.assets },
			mathjaxStyles: payload.mathjaxStyles || '',
		});
		const swapMathjaxStyles = (cssText) => {
			const normalized = String(cssText || '').trim();
			const existing = document.getElementById('inn-mathjax-chtml-styles');
			if (!normalized) {
				existing?.remove();
				return;
			}
			const style = existing || document.createElement('style');
			style.id = 'inn-mathjax-chtml-styles';
			style.textContent = normalized;
			if (!existing) document.head.appendChild(style);
		};
		const collectPageAssets = (doc, pageHref) => {
			const collectUrls = (selector, attr) => Array.from(doc.querySelectorAll(selector))
				.map((node) => node.getAttribute(attr))
				.filter(Boolean)
				.map((value) => new URL(value, pageHref).href);
			return {
				stylesheets: collectUrls('link[rel="stylesheet"][href*="quarto-diagram/mermaid.css"]', 'href'),
				inlineStyles: [],
				mathScripts: [],
				mermaidScripts: collectUrls('script[src*="quarto-diagram/mermaid.min.js"]', 'src'),
				mermaidStyles: collectUrls('link[rel="stylesheet"][href*="quarto-diagram/mermaid.css"]', 'href'),
			};
		};
		const hasAsset = (selector, targetHref, attr) => Array.from(document.querySelectorAll(selector)).some((node) => {
			const value = node.getAttribute(attr);
			if (!value) return false;
			try {
				return new URL(value, window.location.href).href === targetHref;
			} catch {
				return value === targetHref;
			}
		});
		const ensureScriptAsset = (src) => {
			if (!src) return Promise.resolve();
			if (hasAsset(`script[src]`, src, 'src')) return Promise.resolve();
			if (assetLoadCache.has(src)) return assetLoadCache.get(src);
			const promise = new Promise((resolve, reject) => {
				const script = document.createElement('script');
				script.src = src;
				script.async = false;
				script.onload = () => resolve();
				script.onerror = () => reject(new Error(`Failed to load ${src}`));
				document.head.appendChild(script);
			}).catch(() => {});
			assetLoadCache.set(src, promise);
			return promise;
		};
		const ensureStyleAsset = (href) => {
			if (!href || hasAsset(`link[rel="stylesheet"][href]`, href, 'href')) return;
			const link = document.createElement('link');
			link.rel = 'stylesheet';
			link.href = href;
			document.head.appendChild(link);
		};
		const ensureInlineStyleAsset = (content) => {
			if (!content) return;
			const normalized = content.trim();
			const existing = Array.from(document.head.querySelectorAll('style')).some((node) => (node.textContent || '').trim() === normalized);
			if (existing) return;
			const style = document.createElement('style');
			style.setAttribute('data-inn-dynamic-style', 'true');
			style.textContent = normalized;
			document.head.appendChild(style);
		};
		const ensurePageAssets = async (assets = {}) => {
			(assets.stylesheets || []).forEach(ensureStyleAsset);
			(assets.inlineStyles || []).forEach(ensureInlineStyleAsset);
			await Promise.all([
				...(assets.mathScripts || []).map((src) => ensureScriptAsset(src)),
				...(assets.mermaidScripts || []).map((src) => ensureScriptAsset(src)),
			]);
		};
		const rewriteMainRelativeUrls = (root, pageHref) => {
			if (!root || !pageHref) return;
			const selectors = [
				['a[href]', 'href'],
				['img[src]', 'src'],
				['source[src]', 'src'],
				['source[srcset]', 'srcset'],
				['img[srcset]', 'srcset'],
				['video[poster]', 'poster'],
				['audio[src]', 'src'],
				['iframe[src]', 'src'],
			];
			const rewriteUrlAttr = (node, attr) => {
				const raw = node.getAttribute(attr);
				if (!raw || raw.startsWith('#') || /^(?:[a-z]+:|\/\/)/i.test(raw)) return;
				try {
					node.setAttribute(attr, new URL(raw, pageHref).href);
				} catch {
					/* ignore */
				}
			};
			const rewriteSrcSet = (node, attr) => {
				const raw = node.getAttribute(attr);
				if (!raw) return;
				const rewritten = raw
					.split(',')
					.map((part) => {
						const trimmed = part.trim();
						if (!trimmed) return trimmed;
						const [urlPart, descriptor] = trimmed.split(/\s+/, 2);
						if (!urlPart || /^(?:[a-z]+:|\/\/)/i.test(urlPart) || urlPart.startsWith('#')) {
							return trimmed;
						}
						try {
							const abs = new URL(urlPart, pageHref).href;
							return descriptor ? `${abs} ${descriptor}` : abs;
						} catch {
							return trimmed;
						}
					})
					.join(', ');
				node.setAttribute(attr, rewritten);
			};
			selectors.forEach(([selector, attr]) => {
				root.querySelectorAll(selector).forEach((node) => {
					if (attr === 'srcset') {
						rewriteSrcSet(node, attr);
					} else {
						rewriteUrlAttr(node, attr);
					}
				});
			});
		};
		const MAIN_FRAGMENT_RE = /<main\b[^>]*\bid=["']quarto-document-content["'][^>]*>[\s\S]*?<\/main>/i;
		const TITLE_RE = /<title[^>]*>([\s\S]*?)<\/title>/i;
		const fetchPagePayload = async (value) => {
			const url = new URL(value, window.location.href);
			const key = getPageCacheKey(url.href);
			const cached = pageCache.get(key);
			if (cached) {
				return clonePagePayload(cached);
			}

			const response = await fetch(url.href, { credentials: 'same-origin' });
			if (!response.ok) return null;
			const html = await response.text();
			const mainFragment = html.match(MAIN_FRAGMENT_RE)?.[0];
			const doc = new DOMParser().parseFromString(
				mainFragment || html,
				'text/html',
			);
			const main = doc.querySelector('main#quarto-document-content');
			if (!main) return null;
			const titleMatch = html.match(TITLE_RE);
			const fullDoc = new DOMParser().parseFromString(html, 'text/html');
			const payload = {
				title: titleMatch?.[1]?.trim() || doc.title,
				main,
				mathjaxStyles: fullDoc.getElementById('inn-mathjax-chtml-styles')?.textContent || '',
				assets: collectPageAssets(
					mainFragment ? fullDoc : doc,
					url.href,
				),
			};
			rewriteMainRelativeUrls(payload.main, url.href);
			rememberPage(key, payload);
			return clonePagePayload(payload);
		};
		// Hover/intent prefetch into pageCache: the SPA reader then swaps
		// instantly with zero network wait. Bounded (2 in flight), skips
		// metered connections; one attempt per page per load; silent on error.
		const prefetchSeen = new Set();
		const prefetchQueue = [];
		let prefetchActive = 0;
		const PREFETCH_MAX_ACTIVE = 2;
		const pumpPrefetchQueue = () => {
			while (prefetchActive < PREFETCH_MAX_ACTIVE && prefetchQueue.length) {
				const next = prefetchQueue.shift();
				prefetchActive += 1;
				fetchPagePayload(next).catch(() => null).finally(() => {
					prefetchActive -= 1;
					pumpPrefetchQueue();
				});
			}
		};
		const prefetchPage = (value) => {
			try {
				if (navigator.connection?.saveData) return;
				const url = new URL(value, window.location.href);
				if (url.origin !== window.location.origin) return;
				if (!/\.html?$/i.test(url.pathname) && !/\/$/.test(url.pathname)) return;
				const key = getPageCacheKey(url.href);
				if (pageCache.has(key) || prefetchSeen.has(key)) return;
				prefetchSeen.add(key);
				prefetchQueue.push(url.href);
				pumpPrefetchQueue();
			} catch {
				/* ignore */
			}
		};

		const syncSidebarReadState = () => {
			document.querySelectorAll('.sidebar-item-text.sidebar-link[href]:not([data-nav-section-toggle="true"])').forEach(link => {
				const href = normalizePath(link.getAttribute('data-original-href') || link.getAttribute('href') || '');
				const isArticleLink = /\.html?$/.test(href) || /\/$/.test(href);
				link.classList.toggle('inn-read-title', isArticleLink && !!localStorage.getItem(getReadStorageKey(href)));
			});
		};

		const offsetBase = (document.querySelector('meta[name="quarto:offset"]')?.getAttribute('content') || '').replace(/\/?$/, '/');
		const withOffset = (href) => {
			if (!href) return '#';
			if (/^(?:https?:)?\/\//.test(href)) return href;
			return `${offsetBase}${href}`.replace(/\/{2,}/g, '/').replace(/^(\w+:)\//, '$1//');
		};

		const INN_LANG_STORAGE_KEY = 'inn_lang_preference';
		const innNormRelPath = (p) => {
			let s = String(p || '').trim().replace(/\\/g, '/');
			try {
				s = decodeURIComponent(s);
			} catch {
				/* keep s */
			}
			return s.replace(/^\/+/, '');
		};
		/** Only Theoretical Computer Science participates in EN↔RU (sidebar links, toggle, title sync). Other `*.ru.qmd` builds stay on disk but are hidden from this UI. */
		const INN_TRANSLATION_PATH_PREFIX = 'semester-2/Theoretical Computer Science/';
		const innTranslationEnabledForRel = (rel) => {
			const r = innNormRelPath(rel);
			if (!r) return false;
			return r.startsWith(INN_TRANSLATION_PATH_PREFIX);
		};
		/** English article path: `foo.ru.html` → `foo.html`. */
		const innCanonicalArticleEnRel = (rel) => {
			const r = innNormRelPath(rel);
			if (/\.ru\.html$/i.test(r)) return r.replace(/\.ru\.html$/i, '.html');
			return r;
		};
		/** Sibling Russian URL path: `path.html` → `path.ru.html`. */
		const innEnToRuRel = (enRel) => {
			const r = innNormRelPath(enRel);
			if (!/\.html$/i.test(r) || /\.ru\.html$/i.test(r)) return null;
			return r.replace(/\.html$/i, '.ru.html');
		};
		let innRuEnHas = new Set();
		let innRuTitleByEnRel = new Map();
		let innEnTitleByEnRel = new Map();
		let innRuManifestPromise = null;
		const innFetchRuPageExists = async (ruRel) => {
			if (!ruRel || !innTranslationEnabledForRel(ruRel)) return false;
			try {
				const url = new URL(innSitePathFromRel(ruRel), window.location.origin);
				const response = await fetch(url.href, {
					method: 'GET',
					credentials: 'same-origin',
					cache: 'no-store',
				});
				return response.ok;
			} catch {
				return false;
			}
		};
		/**
		 * Build the EN→RU availability map from the tiny build-time manifest
		 * (`ru-manifest.json`, a few KB, cacheable — see scripts/update_ru_manifest.py).
		 * It used to parse the whole 13+ MB `search.json` with `no-store` on EVERY
		 * page load, blocking the entire UI boot for seconds after first paint.
		 */
		const innLoadRuManifest = async () => {
			if (innRuManifestPromise) return innRuManifestPromise;
			innRuManifestPromise = (async () => {
				const next = new Set();
				const ruTitles = new Map();
				const enTitles = new Map();
				try {
					const response = await fetch(innSitePathFromRel('ru-manifest.json'), {
						credentials: 'same-origin',
					});
					if (response.ok) {
						const data = await response.json();
						const pairs = data && typeof data === 'object' ? data.pairs : null;
						if (pairs && typeof pairs === 'object') {
							Object.keys(pairs).forEach((enRelRaw) => {
								const enRel = innNormRelPath(enRelRaw);
								if (!/\.html$/i.test(enRel) || /\.ru\.html$/i.test(enRel)) return;
								if (!innTranslationEnabledForRel(enRel)) return;
								const entry = pairs[enRelRaw] || {};
								next.add(enRel);
								const enTitle = String(entry.enTitle || '').trim();
								const ruTitle = String(entry.ruTitle || '').trim();
								if (enTitle) enTitles.set(enRel, enTitle);
								if (ruTitle) ruTitles.set(enRel, ruTitle);
							});
						}
					}
				} catch {
					/* fallback below */
				}
				const currentRel = innPathToRel(window.location.pathname);
				if (/\.ru\.html$/i.test(currentRel) && innTranslationEnabledForRel(currentRel)) {
					next.add(innCanonicalArticleEnRel(currentRel));

		function innScrollMaxY() {

				body.scrollHeight,

		}

					childList.style.opacity = isOpen ? '1' : '0';
					childList.style.pointerEvents = isOpen ? 'auto' : 'none';
					localStorage.setItem(storageKey, isOpen ? 'open' : 'closed');
				};

				const applyOpen = (isOpen, animate = true) => {
					// Epoch invalidates stale completions from superseded toggles:
					// rapid clicks, SPA-nav style stomps, or interrupted transitions
					// (Firefox reports those as transitioncancel, not transitionend).
					const epoch = (section._innNavEpoch || 0) + 1;
					section._innNavEpoch = epoch;
					if (!animate || reduceMotion()) {
						if (section._innNavEpoch !== epoch) return;
						finalizeOpen(isOpen);
						return;
					}

					childList.hidden = false;
					const startHeight = childList.getBoundingClientRect().height;
					const targetHeight = isOpen
						? (() => {
							childList.style.height = 'auto';
							return childList.scrollHeight;
						})()
						: 0;

					childList.style.height = `${startHeight}px`;
					childList.style.opacity = isOpen ? '0' : '1';
					childList.style.pointerEvents = 'none';

					let settled = false;
					let fallbackId = 0;
					const cleanup = () => {
						childList.removeEventListener('transitionend', onEnd);
						childList.removeEventListener('transitioncancel', onEnd);
						if (fallbackId) {
							window.clearTimeout(fallbackId);
							fallbackId = 0;
						}
					};
					const finish = () => {
						if (settled) return;
						settled = true;
						cleanup();
						if (section._innNavEpoch !== epoch) return;
						finalizeOpen(isOpen);
					};
					const onEnd = (event) => {
						if (event.target !== childList) return;
						if (event.type === 'transitioncancel') {
							finish();
							return;
						}
						if (event.propertyName !== 'height') return;
						finish();
					};

					childList.addEventListener('transitionend', onEnd);
					childList.addEventListener('transitioncancel', onEnd);
					// Fallback: a transition may never run (same-height toggle,
					// hidden subtree, animations disabled) and then no event fires.
					fallbackId = window.setTimeout(finish, 320);
					section.classList.toggle('is-open', isOpen);
					window.requestAnimationFrame(() => {
						if (settled) return;
						if (Math.abs(targetHeight - startHeight) < 0.5) {
							finish();
							return;
						}
						childList.style.height = `${targetHeight}px`;
						childList.style.opacity = isOpen ? '1' : '0';
					});
				};

				textToggle.removeAttribute('data-bs-toggle');
				textToggle.removeAttribute('data-bs-target');
				textToggle.removeAttribute('href');
				textToggle.setAttribute('role', 'button');
				textToggle.dataset.navSectionToggle = 'true';
				iconToggle.removeAttribute('data-bs-toggle');
				iconToggle.removeAttribute('data-bs-target');
				iconToggle.removeAttribute('href');
				iconToggle.setAttribute('role', 'button');
				iconToggle.dataset.navSectionToggle = 'true';

				const toggle = (event) => {
					event.preventDefault();
					event.stopPropagation();
					applyOpen(!section.classList.contains('is-open'), true);
					window.setTimeout(collectPrefetchCandidates, 220);
				};

				textToggle.addEventListener('click', toggle);
				iconToggle.addEventListener('click', toggle);
				applyOpen(open, false);
			});

			const navWidthKey = 'inn_custom_nav_width';
			const minWidth = 272;
			const maxWidth = 520;
			const defaultWidth = 344;
			const applyWidth = (width, persist = true) => {
				const clamped = Math.max(minWidth, Math.min(maxWidth, Math.round(width)));
				const px = `${clamped}px`;
				document.documentElement.style.setProperty('--inn-nav-width', px);
				document.body.style.setProperty('--inn-nav-width', px);
				nav.style.width = px;
				if (persist) localStorage.setItem(navWidthKey, String(clamped));
			};

			if (!mobile) {
				const storedWidth = parseInt(localStorage.getItem(navWidthKey) || '', 10);
				applyWidth(Number.isFinite(storedWidth) ? storedWidth : defaultWidth, false);

				const resizer = nav.querySelector('.inn-site-nav__resizer');
				let dragFrame = null;
				let pendingWidth = Number.isFinite(storedWidth) ? storedWidth : defaultWidth;
				const startResize = (clientX) => {
					resizer.classList.add('is-dragging');
					const onMove = (moveX) => {
						pendingWidth = moveX;
						if (dragFrame !== null) return;
						dragFrame = window.requestAnimationFrame(() => {
							dragFrame = null;
							applyWidth(pendingWidth, false);
						});
					};
					const onMouseMove = (event) => onMove(event.clientX);
					const onTouchMove = (event) => {
						if (event.touches[0]) onMove(event.touches[0].clientX);
					};
					const stop = () => {
						resizer.classList.remove('is-dragging');
						if (dragFrame !== null) {
							window.cancelAnimationFrame(dragFrame);
							dragFrame = null;
						}
						applyWidth(pendingWidth, true);
						window.removeEventListener('mousemove', onMouseMove);
						window.removeEventListener('mouseup', stop);
						window.removeEventListener('touchmove', onTouchMove);
						window.removeEventListener('touchend', stop);
					};
					window.addEventListener('mousemove', onMouseMove);
					window.addEventListener('mouseup', stop);
					window.addEventListener('touchmove', onTouchMove, { passive: true });
					window.addEventListener('touchend', stop, { passive: true });
				};

				resizer?.addEventListener('mousedown', (event) => {
					event.preventDefault();
					startResize(event.clientX);
				});
			}

			updateActiveNavState();
			collectPrefetchCandidates();
			updateSearchButtonState();
			finishInitialBoot();
			// Background RU refresh: link targets, TCS titles, toggles, active
			// state, and the language fallback redirect only depend on the tiny
			// manifest — they must not delay boot. The pre-paint head redirect
			// (bake-injected alternate links) already handled the common case,
			// so syncInitialLanguage below is a pure fallback and no-ops then.
			void (async () => {
				try {
					await innLoadRuManifest();
				} catch {
					return;
				}
				try {
					innApplyNavLangPreference(nav);
				} catch {
					/* ignore */
				}
				try {
					syncTranslatedSidebarMenuTitle();
				} catch {
					/* ignore */
				}
				try {
					syncNavToggles();
				} catch {
					/* ignore */
				}
				try {
					updateActiveNavState();
				} catch {
					/* ignore */
				}
				try {
					await innEnsureCurrentRuAvailability(window.location.pathname);
				} catch {
					/* ignore */
				}
				try {
					innApplyNavLangPreference(nav);
					syncNavToggles();
				} catch {
					/* ignore */
				}
				try {
					const pref = innGetLangPreference();
					const pair = innGetTranslationPair(window.location.pathname);
					if (pair) {
						const cur = normalizePath(getPathKey());
						if (pref === 'ru' && !pair.isRu && cur === normalizePath(pair.enHref)) {
							void navigateTo(new URL(pair.ruHref, window.location.origin).href, { replace: true });
						} else if (pref === 'en' && pair.isRu && cur === normalizePath(pair.ruHref)) {
							void navigateTo(new URL(pair.enHref, window.location.origin).href, { replace: true });
						}
					}
				} catch {
					/* ignore */
				}
			})();
			return true;
		};
		applyArticleUI();
		innPageFullyLoaded = true;

		const sidebar = document.querySelector('#quarto-sidebar');
		if (!sidebar) return;
		if (await initializeCustomNav(sidebar, { mobile: window.innerWidth <= 991 })) {
			return;
		}

		const sidebarWidthKey = 'sidebar_width_px';
		const defaultSidebarWidth = 384;
		const minSidebarWidth = 288;
		const maxSidebarWidth = 608;
		let currentSidebarWidth = defaultSidebarWidth;
		let widthFrame = null;

		const syncSidebarLayout = (width) => {
			const px = `${width}px`;
			document.documentElement.style.setProperty('--inn-sidebar-width', px);
			document.body.style.setProperty('--inn-sidebar-width', px);
			sidebar.style.width = px;
			const glass = document.querySelector('#quarto-sidebar-glass');
			if (glass) {
				glass.style.left = px;
			}
			window.dispatchEvent(new Event('resize'));
		};

		const setSidebarWidth = (width, { persist = true } = {}) => {
			const clamped = Math.max(minSidebarWidth, Math.min(maxSidebarWidth, Math.round(width)));
			currentSidebarWidth = clamped;
			syncSidebarLayout(clamped);
			if (persist) {
				localStorage.setItem(sidebarWidthKey, String(clamped));
			}
		};

		const savedSidebarWidth = parseInt(localStorage.getItem(sidebarWidthKey) || '', 10);
		setSidebarWidth(Number.isFinite(savedSidebarWidth) ? savedSidebarWidth : defaultSidebarWidth);

		if (window.innerWidth > 991) {
			const resizer = document.createElement('div');
			resizer.className = 'inn-sidebar-resizer';
			resizer.setAttribute('aria-hidden', 'true');
			sidebar.appendChild(resizer);

			const startResize = (clientX) => {
				resizer.classList.add('is-dragging');
				sidebar.classList.add('inn-sidebar-ready');
				const onMove = (moveX) => {
					const nextWidth = Math.max(minSidebarWidth, Math.min(maxSidebarWidth, Math.round(moveX)));
					if (nextWidth === currentSidebarWidth) return;
					currentSidebarWidth = nextWidth;
					if (widthFrame !== null) return;
					widthFrame = window.requestAnimationFrame(() => {
						widthFrame = null;
						syncSidebarLayout(currentSidebarWidth);
					});
				};
				const onMouseMove = (e) => onMove(e.clientX);
				const onTouchMove = (e) => {
					if (e.touches[0]) onMove(e.touches[0].clientX);
				};
				const stop = () => {
					resizer.classList.remove('is-dragging');
					if (widthFrame !== null) {
						window.cancelAnimationFrame(widthFrame);
						widthFrame = null;
					}
					setSidebarWidth(currentSidebarWidth, { persist: true });
					window.removeEventListener('mousemove', onMouseMove);
					window.removeEventListener('mouseup', stop);
					window.removeEventListener('touchmove', onTouchMove);
					window.removeEventListener('touchend', stop);
				};
				window.addEventListener('mousemove', onMouseMove);
				window.addEventListener('mouseup', stop);
				window.addEventListener('touchmove', onTouchMove, { passive: true });
				window.addEventListener('touchend', stop, { passive: true });
			};

			resizer.addEventListener('mousedown', (e) => {
				e.preventDefault();
				startResize(e.clientX);
			});
		}

		const sections = sidebar.querySelectorAll('li.sidebar-item-section');
		sections.forEach(section => {
			const toggle = section.querySelector('.sidebar-item-toggle');
			const targetId = toggle?.getAttribute('data-bs-target');
			const target = targetId ? document.querySelector(targetId) : null;
			if (!toggle || !target) return;

			const textLink = section.querySelector('.sidebar-item-text[data-bs-toggle="collapse"]');
			const sectionTitle = textLink?.querySelector('.menu-text')?.textContent?.trim() || targetId;
			const storageKey = `sidebar_section_${sectionTitle}`;
			const saved = localStorage.getItem(storageKey);
			const icon = toggle.querySelector('i');

			const syncChevron = (isOpen) => {
				if (!icon) return;
				icon.classList.add('bi-chevron-right');
				icon.classList.remove('bi-chevron-down');
				icon.classList.toggle('inn-chevron-open', isOpen);
			};

			const syncExpandedUI = (isOpen) => {
				[toggle, textLink].forEach(el => {
					if (!el) return;
					el.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
					el.classList.toggle('collapsed', !isOpen);
				});
				syncChevron(isOpen);
			};

			if (saved === 'open') {
				target.classList.add('show');
				syncExpandedUI(true);
			} else if (saved === 'closed') {
				target.classList.remove('show');
				syncExpandedUI(false);
			} else {
				syncExpandedUI(target.classList.contains('show'));
			}

			if (window.bootstrap?.Collapse) {
				bootstrap.Collapse.getInstance(target)?.dispose();
				bootstrap.Collapse.getOrCreateInstance(target, { toggle: false });
			}

			[toggle, textLink].forEach(el => {
				el?.addEventListener('click', () => {
					sidebar.classList.add('inn-sidebar-ready');
				});
			});

			new MutationObserver(() => {
				const isOpen = target.classList.contains('show');
				localStorage.setItem(storageKey, isOpen ? 'open' : 'closed');
				syncExpandedUI(isOpen);
			}).observe(target, { attributes: true, attributeFilter: ['class'] });
		});

		const scrollKey = 'sidebar_scroll_top';
		const savedScroll = localStorage.getItem(scrollKey);
		if (savedScroll && !isNaN(parseInt(savedScroll, 10))) {
			sidebar.scrollTop = parseInt(savedScroll, 10);
		}
		sidebar.addEventListener('scroll', () => {
			localStorage.setItem(scrollKey, sidebar.scrollTop);
		});
	};
	const bootUI = async () => {
		try {
			await initializeInnoNotesUI();
		} catch (error) {
			console.error('InnoNotes UI init failed', error);
			document.documentElement.classList.remove('inn-ui-booting');
			document.body?.classList.remove('inn-ui-booting');
			const existingLoader = document.getElementById('inn-page-loader');
			existingLoader?.classList.remove('is-active');
			existingLoader?.classList.remove('is-booting');
		}
	};
	if (document.readyState === 'loading') {
		document.addEventListener('DOMContentLoaded', () => void bootUI(), { once: true });
	} else {
		void bootUI();
	}
</script>
