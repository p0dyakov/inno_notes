<style>
	.article-buttons {
		margin-top: 1rem;
	}

	.mark-read {
		padding: 6px 12px;
		border: 1px solid #ccc;
		border-radius: 4px;
		background: #f8f9fa;
		color: #212529;
		font-family: sans-serif;
		cursor: pointer;
		transition: background-color .2s, border-color .2s, color .2s;
		font-size: .9rem;
		line-height: 1.5;
	}

	.mark-read:hover {
		background: #e9ecef;
		border-color: #bdbdbd;
	}

	.mark-read.active {
		background: #4285F4;
		color: #fff;
		border-color: #4285F4;
	}

	.read-title {
		text-decoration: line-through;
		opacity: .7;
	}

	.sidebar-link.read-title {
		text-decoration: line-through;
		opacity: .7;
	}

	.mark-solved {
		padding: 3px 8px;
		border: 1px solid #ccc;
		border-radius: 4px;
		background: #f8f9fa;
		color: #212529;
		font-family: sans-serif;
		cursor: pointer;
		transition: background-color .2s, border-color .2s, color .2s;
		font-size: .8rem;
		line-height: 1.5;
		margin-left: 8px;
		vertical-align: middle;
	}

	.mark-solved:hover {
		background: #e9ecef;
		border-color: #bdbdbd;
	}

	.mark-solved.active {
		background: #34a853;
		color: #fff;
		border-color: #34a853;
	}

	.solved-title {
		text-decoration: line-through;
		opacity: .6;
	}
</style>

<div class="article-buttons">
	<button class="mark-read" data-article-id="">Mark as Read</button>
</div>

<script>
	document.addEventListener('DOMContentLoaded', () => {
		const basePath = '/inno_notes/';
		const curPath = window.location.pathname.replace(/index\.html$/, '').replace(basePath, '');
		const isHome = curPath === '/' || curPath === '' || curPath.includes('index');
		if (isHome) {
			document.querySelector('.article-buttons')?.remove();
		}

		if (!isHome) {
			const currentUrl = window.location.href;
			const btn = document.querySelector('.mark-read');
			const title = document.querySelector('h1');
			const sidebarLinks = document.querySelectorAll('.sidebar-item-text.sidebar-link[data-original-href]');

			const getRead = () => localStorage.getItem(`read_${currentUrl}`);
			const setRead = (v) => v ? localStorage.setItem(`read_${currentUrl}`, 'true')
				: localStorage.removeItem(`read_${currentUrl}`);

			const updateUI = (isRead) => {
				btn.classList.toggle('active', isRead);
				btn.textContent = isRead ? 'Read' : 'Mark as Read';
				title?.classList.toggle('read-title', isRead);
				sidebarLinks.forEach(l => {
					const h = l.getAttribute('data-original-href') || l.getAttribute('href') || '';
					if (h === currentUrl) l.classList.toggle('read-title', isRead);
				});
			};

			updateUI(!!getRead());

			btn?.addEventListener('click', () => {
				const was = !!getRead();
				setRead(!was);
				updateUI(!was);
			});

			sidebarLinks.forEach(l => {
				const h = l.getAttribute('data-original-href') || l.getAttribute('href') || '';
				if (localStorage.getItem(`read_${h}`)) l.classList.add('read-title');
			});
		}

		// Mark as Solved buttons for examples (sections 3.N / 4.N)
		if (!isHome) {
			const pageKey = window.location.pathname;
			document.querySelectorAll('h5').forEach(h5 => {
				const text = h5.textContent || '';
				if (!/^\s*[34]\.\d+[\.\s]/.test(text)) return;

				const solvedKey = `solved_${pageKey}_${text.trim()}`;
				const btn = document.createElement('button');
				btn.className = 'mark-solved';
				btn.textContent = '✓ Solved';

				// Wrap text nodes in a span so strikethrough doesn't affect other children (e.g. anchor icon)
				let textSpan = h5.querySelector('.problem-title-text');
				if (!textSpan) {
					textSpan = document.createElement('span');
					textSpan.className = 'problem-title-text';
					const nodes = [...h5.childNodes].filter(n => n.nodeType === Node.TEXT_NODE || n.nodeName === 'STRONG' || n.nodeName === 'EM');
					nodes.forEach(n => textSpan.appendChild(n.cloneNode(true)));
					nodes.forEach(n => n.parentNode?.removeChild(n));
					h5.prepend(textSpan);
				}

				const applyState = (solved) => {
					btn.classList.toggle('active', solved);
					textSpan.classList.toggle('solved-title', solved);
				};

				applyState(!!localStorage.getItem(solvedKey));

				btn.addEventListener('click', (e) => {
					e.stopPropagation();
					const was = !!localStorage.getItem(solvedKey);
					was ? localStorage.removeItem(solvedKey) : localStorage.setItem(solvedKey, 'true');
					applyState(!was);
				});

				h5.appendChild(btn);
			});
		}

		const sidebar = document.querySelector('#quarto-sidebar');
		if (!sidebar) return;

		const sections = sidebar.querySelectorAll('li.sidebar-item-section');
		sections.forEach(section => {
			const toggle = section.querySelector('.sidebar-item-toggle');
			const targetId = toggle?.getAttribute('data-bs-target');
			const target = targetId ? document.querySelector(targetId) : null;
			if (!toggle || !target) return;

			const storageKey = `sidebar_section_${targetId}`;

			const saved = localStorage.getItem(storageKey);
			if (saved === 'open') {
				target.classList.add('show');
				toggle.setAttribute('aria-expanded', 'true');
				toggle.querySelector('i')?.classList.replace('bi-chevron-right', 'bi-chevron-down');
			} else if (saved === 'closed') {
				target.classList.remove('show');
				toggle.setAttribute('aria-expanded', 'false');
				toggle.querySelector('i')?.classList.replace('bi-chevron-down', 'bi-chevron-right');
			}

			target.addEventListener('show.bs.collapse', () => {
				localStorage.setItem(storageKey, 'open');
				toggle.setAttribute('aria-expanded', 'true');
				toggle.querySelector('i')?.classList.replace('bi-chevron-right', 'bi-chevron-down');
			});

			target.addEventListener('hide.bs.collapse', () => {
				localStorage.setItem(storageKey, 'closed');
				toggle.setAttribute('aria-expanded', 'false');
				toggle.querySelector('i')?.classList.replace('bi-chevron-down', 'bi-chevron-right');
			});
		});

		const scrollKey = 'sidebar_scroll_top';
		const savedScroll = localStorage.getItem(scrollKey);
		if (savedScroll && !isNaN(parseInt(savedScroll, 10))) {
			sidebar.scrollTop = parseInt(savedScroll, 10);
		}
		sidebar.addEventListener('scroll', () => {
			localStorage.setItem(scrollKey, sidebar.scrollTop);
		});
	});
</script>
