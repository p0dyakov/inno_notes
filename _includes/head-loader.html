<script>
(function () {
	var KEY = "inn-color-mode";
	function stored() {
		try {
			return localStorage.getItem(KEY);
		} catch {
			return null;
		}
	}
	function computeDark() {
		var s = stored();
		if (s === "light") return false;
		if (s === "dark") return true;
		try {
			return window.matchMedia("(prefers-color-scheme: dark)").matches;
		} catch {
			return false;
		}
	}
	function apply() {
		var dark = computeDark();
		document.documentElement.classList.toggle("inn-dark", dark);
		try {
			document.documentElement.setAttribute("data-bs-theme", dark ? "dark" : "light");
		} catch {
			/* ignore */
		}
		try {
			window.dispatchEvent(new CustomEvent("inn-color-mode-change"));
		} catch {
			/* ignore */
		}
	}
	apply();
	try {
		window.__innColorMode = {
			get: function () {
				return stored() || "auto";
			},
			set: function (mode) {
				if (mode === "auto") {
					try {
						localStorage.removeItem(KEY);
					} catch {
						/* ignore */
					}
				} else {
					try {
						localStorage.setItem(KEY, mode);
					} catch {
						/* ignore */
					}
				}
				apply();
			},
			apply: apply,
		};
		window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
			if (!stored()) apply();
		});
	} catch {
		/* ignore */
	}
	if (!document.documentElement.hasAttribute("data-inn-baked")) {
		document.documentElement.classList.add("inn-ui-booting");
	}
})();
</script>
<script>
// Sync pre-paint UI state: font stack + saved panel widths from localStorage.
// Must run before first paint so the page never flashes default fonts/widths
// and post-load JS only re-applies identical values (no visual change).
(function () {
	try {
		var f = null;
		try {
			f = localStorage.getItem("inn-sans");
		} catch (e) {}
		// Deterministic default 'sf' (matches innResolveSansMode in index.html).
		document.documentElement.classList.add(f === "archivo" ? "inn-sans-archivo" : "inn-sans-sf");
	} catch (e) {}
	function px(key, min, max, deflt) {
		var v = deflt;
		try {
			var raw = parseInt(localStorage.getItem(key) || "", 10);
			if (isFinite(raw)) v = Math.max(min, Math.min(max, raw));
		} catch (e) {}
		return v;
	}
	try {
		document.documentElement.style.setProperty(
			"--inn-nav-width",
			px("inn_custom_nav_width", 272, 520, 344) + "px",
		);
		document.documentElement.style.setProperty(
			"--inn-sidebar-width",
			px("sidebar_width_px", 288, 608, 384) + "px",
		);
	} catch (e) {}
})();
</script>
